[project]
name = "plane-demo"
version = "0.1.0"
description = "Child-initiated three-plane configuration demonstration"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "psycopg[binary]>=3.2,<4",
  "kubernetes>=32,<35",
  "redis>=5.2,<7",
  "httpx>=0.28,<1",
]

[dependency-groups]
dev = ["pytest>=8.3,<10", "ruff>=0.11,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration"]
addopts = "--basetemp=.pytest-work"
markers = ["integration: requires explicit disposable dependency DSNs"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.hatch.build.targets.wheel]
packages = ["src/plane_demo"]
