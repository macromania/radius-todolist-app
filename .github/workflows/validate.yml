name: validate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source:
    name: Cloud-free source and infrastructure checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.11.7"
          python-version: "3.13"
      - name: Install pinned Radius and its Bicep compiler
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .state/check/bin "$HOME/.rad/bin"
          curl -fL --retry 3 \
            https://github.com/radius-project/radius/releases/download/v0.60.2/rad_linux_amd64 \
            -o .state/check/bin/rad
          echo "941daf7f646e93351a690f7327875e86adba761cf72d6e8238f1b6741798a745  .state/check/bin/rad" | sha256sum -c -
          curl -fL --retry 3 \
            https://github.com/Azure/bicep/releases/download/v0.42.1/bicep-linux-x64 \
            -o "$HOME/.rad/bin/bicep"
          echo "aed90eb2c69a6ee2bd70dc0d4354408ac4d04fd9911d3ec8e0cd74ad173e7139  $HOME/.rad/bin/bicep" | sha256sum -c -
          chmod +x .state/check/bin/rad "$HOME/.rad/bin/bicep"
          echo "$PWD/.state/check/bin" >> "$GITHUB_PATH"
      - name: Install project dependencies
        run: uv sync --locked
      - name: Validate runtime, harness, images, and Bicep contracts
        run: make check
