name: validate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bicep:
    name: Compile every Bicep file
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The Bicep compiler bundled with rad is the only one that builds all of
      # these. The az CLI's bicep is older: it lacks the redisEnterprise types
      # and rejects @secure() outputs with BCP129. Radius files additionally
      # need the `radius` extension, which plain bicep cannot resolve at all.
      - name: Install the rad CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/radius-project/radius/main/deploy/install.sh \
            | /bin/bash -s 0.60.2
          rad version

      - name: Compile the Azure-only templates
        run: |
          set -euo pipefail
          for f in infra/main.bicep infra/registry.bicep infra/radius/recipes/azure/managed-redis.bicep; do
            echo "==> $f"
            "$HOME/.rad/bin/bicep" build --stdout "$f" > /dev/null
          done

      # Radius templates are compiled through the rad CLI, which supplies the
      # extension types. The parameter values are placeholders: this proves the
      # templates compile, not that they deploy.
      - name: Compile the Radius templates
        run: |
          set -euo pipefail
          SCOPE=/planes/radius/local/resourcegroups/ci/providers/Applications.Core
          rad bicep generate-kubernetes-manifest infra/radius/app.bicep -g ci \
            --parameters application="$SCOPE/applications/todolist" \
            --parameters environment="$SCOPE/environments/local" \
            --destination-file /tmp/app.yaml
          rad bicep generate-kubernetes-manifest infra/radius/environments/local.bicep -g ci \
            --destination-file /tmp/env-local.yaml
          rad bicep generate-kubernetes-manifest infra/radius/environments/azure.bicep -g ci \
            --parameters azureSubscriptionId=00000000-0000-0000-0000-000000000000 \
            --parameters redisRecipeRef=example.azurecr.io/r/x:0.1.0 \
            --parameters privateEndpointSubnetId=/subscriptions/x/resourceGroups/y/providers/Microsoft.Network/virtualNetworks/v/subnets/s \
            --parameters privateDnsZoneId=/subscriptions/x/resourceGroups/y/providers/Microsoft.Network/privateDnsZones/z \
            --destination-file /tmp/env-azure.yaml

  invariants:
    name: Check the invariants that fail quietly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Each of these guards a mistake that produces a deployment which looks
      # healthy and fails later. They are cheap; the failures they prevent are
      # not.
      - name: The Redis Recipe must emit tls true
        run: |
          grep -q 'tls: true' infra/radius/recipes/azure/managed-redis.bicep || {
            echo "The Recipe must emit tls: true. Radius otherwise infers TLS"
            echo "from port == 6380, and Azure Managed Redis uses port 10000,"
            echo "so it would build a plaintext redis:// URL for a TLS endpoint."
            exit 1
          }

      - name: The Redis Recipe must percent-encode the access key
        run: |
          grep -q 'uriComponent(' infra/radius/recipes/azure/managed-redis.bicep || {
            echo "The Recipe must wrap the key in uriComponent(). Radius embeds"
            echo "the password in a URL without encoding it, and base64 keys"
            echo "contain '/' about half the time, which makes the URL"
            echo "unparseable and throws TypeError: Invalid URL in the client."
            exit 1
          }

      - name: The connection must stay named redis in lowercase
        run: |
          grep -qE '^\s+redis: \{' infra/radius/app.bicep || {
            echo "The connection must be named 'redis'. Radius uppercases it to"
            echo "build CONNECTION_REDIS_*, which is what the app reads. Any"
            echo "other name and it silently stores todos in process memory."
            exit 1
          }

      - name: Azure Managed Redis must have no public endpoint
        run: |
          grep -q "publicNetworkAccess: 'Disabled'" infra/radius/recipes/azure/managed-redis.bicep || {
            echo "The cache must not be reachable from the internet."
            exit 1
          }

      - name: Shell scripts must pass shellcheck
        run: shellcheck scripts/*.sh

      - name: Recipe publishing must preserve immutable tags
        run: make test-publish-recipe
